<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Iron Log">
<title>Iron Log</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0a'/%3E%3Cpath d='M18 22v20M12 27v10M46 22v20M52 27v10M18 32h28' stroke='%23fff' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--ink:#0a0a0a;--mute:#737373;--line:#e7e7e7;--soft:#f4f4f4;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0a0a0a;--ink:#f2f2f2;--mute:#8c8c8c;--line:#262626;--soft:#151515;color-scheme:dark}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1;padding-bottom:calc(90px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
b{font-weight:700}
.wrap{max-width:600px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.bar{display:flex;justify-content:space-between;align-items:center;height:52px}
.brand{font-weight:800;letter-spacing:.2em;font-size:13px}
.brand span{font-weight:400}
.mute{color:var(--mute)}
main .wrap{padding-top:22px}
h1{font-size:34px;font-weight:800;letter-spacing:-.035em;line-height:1.05}
h2{font-size:18px;font-weight:700;letter-spacing:-.01em}
.big{font-size:56px;font-weight:800;letter-spacing:-.045em;line-height:1}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:600}
.card{border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.card.inv{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card.inv .eyebrow{color:var(--bg);opacity:.6}
.chips{display:flex;gap:6px;margin:16px 0}
.chip{flex:1;min-width:38px;height:40px;border:1px solid var(--line);border-radius:999px;background:none;font-weight:600;font-size:13px;cursor:pointer;transition:background .15s,color .15s}
.chip.today:not(.on){border-color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.progress{height:4px;background:var(--soft);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ink);transition:width .3s}
.ex-name{font-weight:700;font-size:17px;letter-spacing:-.015em}
.rx{font-size:13px;color:var(--mute);margin-top:2px}
.cue{font-size:13px;margin-top:10px;padding-left:10px;border-left:2px solid var(--ink)}
.tag{font-size:9px;letter-spacing:.12em;border:1px solid var(--ink);border-radius:4px;padding:1px 5px;font-weight:700;vertical-align:3px;margin-left:8px}
.hint{font-size:12.5px;color:var(--mute);margin-top:8px}
.sets{margin-top:12px;display:grid;gap:6px}
.set{display:grid;grid-template-columns:24px 1fr 1fr 44px;gap:8px;align-items:center}
.set .no{font-size:12px;color:var(--mute);font-weight:600;text-align:center}
.field{height:44px;border:1px solid var(--line);border-radius:12px;background:var(--soft);display:flex;align-items:center;padding:0 10px;gap:4px;transition:background .15s}
.field input{width:100%;border:0;background:none;outline:none;font-weight:600;font-size:16px;min-width:0}
.field small{color:var(--mute);font-size:11px}
.set.done .field{background:var(--bg)}
.set.done .field input{color:var(--mute)}
.check{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--ink);background:none;cursor:pointer;display:grid;place-items:center;transition:background .15s}
.check svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.set.done .check{background:var(--ink);color:var(--bg)}
.set.done .check svg{opacity:1}
.input{height:44px;border:1px solid var(--line);border-radius:12px;background:var(--soft);padding:0 12px;width:100%;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
.input:focus{border-color:var(--ink)}
textarea.input{height:auto;min-height:84px;padding:10px 12px;resize:vertical}
.label{font-size:12px;color:var(--mute);margin-bottom:6px;display:block;font-weight:500}
.btn{height:48px;border-radius:14px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:700;padding:0 18px;cursor:pointer;width:100%;font-size:15px}
.btn.ghost{background:none;color:var(--ink)}
.btn.sm{height:38px;width:auto;font-size:13px;padding:0 14px;border-radius:12px}
.card.inv .btn{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat{border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-size:24px;font-weight:800;letter-spacing:-.03em}
.stat span{font-size:12px;color:var(--mute)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row[data-open]{cursor:pointer}
.x{background:none;border:0;color:var(--mute);font-size:22px;cursor:pointer;width:32px;height:32px;line-height:1}
.navbtn{width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:none;font-size:20px;cursor:pointer}
.navbtn:disabled{opacity:.25;cursor:default}
.risk{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1.05;margin-top:6px}
ul.list{list-style:none;margin-top:6px}
ul.list li{padding:10px 0 10px 22px;border-bottom:1px solid var(--line);position:relative;font-size:14px}
ul.list li:last-child{border-bottom:0}
ul.list li:before{content:"";position:absolute;left:3px;top:19px;width:9px;height:2px;background:var(--ink)}
.card.inv ul.list li{border-color:rgba(128,128,128,.35)}
.card.inv ul.list li:before{background:var(--bg)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;color:var(--mute)}
.seg button.on{background:var(--ink);color:var(--bg)}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;gap:16px;font-size:12px;color:var(--mute);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;vertical-align:middle;margin-right:6px}
.legend .dot{width:6px;height:6px;border-radius:50%;background:var(--mute)}
.legend .ln{width:16px;height:2px;background:var(--ink)}
.legend .fill{width:10px;height:10px;border-radius:2px;background:var(--ink)}
.legend .out{width:10px;height:10px;border-radius:2px;border:1.5px solid var(--ink)}
.banner{border:1px dashed var(--ink);border-radius:16px;padding:14px;font-size:13px;margin:16px 0}
.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:10}
.tabs button{flex:1;max-width:120px;background:none;border:0;padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--mute);cursor:pointer}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--ink)}
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);border-radius:999px;padding:12px 20px;font-weight:700;z-index:11;border:0;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.25);white-space:nowrap;font-size:14px}
.toast{position:fixed;top:calc(64px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-16px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;transition:.25s;z-index:20;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.spacer{height:12px}
</style>
</head>
<body>
<header class="top"><div class="wrap bar"><div class="brand">IRON<span>LOG</span></div><div class="mute" id="topDate" style="font-size:13px"></div></div></header>
<main id="view"></main>
<button id="timer" class="timer" hidden></button>
<div id="toast" class="toast"></div>
<nav class="tabs">
  <button data-tab="train" class="on"><svg viewBox="0 0 24 24"><path d="M6.5 7v10M3.5 9.5v5M17.5 7v10M20.5 9.5v5M6.5 12h11"/></svg><span>Train</span></button>
  <button data-tab="week"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Week</span></button>
  <button data-tab="weight"><svg viewBox="0 0 24 24"><path d="M3.5 17l5-5 4 4 8-8"/><path d="M14.5 8h6v6"/></svg><span>Weight</span></button>
  <button data-tab="sleep"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg><span>Sleep</span></button>
  <button data-tab="fuel"><svg viewBox="0 0 24 24"><path d="M9 6h11.5M9 12h11.5M9 18h11.5"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg><span>Fuel</span></button>
</nav>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
/* ───────── ROUTINE (from your sheet) ───────── */
const DAYS=['mon','tue','wed','thu','fri','sat','sun'];
const DAYNAMES={mon:'Monday',tue:'Tuesday',wed:'Wednesday',thu:'Thursday',fri:'Friday',sat:'Saturday',sun:'Sunday'};
const ROUTINE={
  mon:{title:'Rest',rest:true,sub:'Recovery day',ex:[]},
  tue:{title:'Legs',sub:'Squat day',ex:[
    {n:'Back squat',s:5,r:7,w:135,warm:'Bar × 12 · 95 lb × 8',cue:'GO LOW — deep as possible, past 90° if you can'},
    {n:'Romanian deadlift (DB)',s:5,r:13,w:60,cue:'60 lb dumbbells · 2 sec hold at the bottom of every rep'},
    {n:'Leg press',s:6,r:16,w:180,cue:'2 plates each side (90 lb per side) · deep as possible'},
    {n:'Lunges (DB)',s:5,r:22,w:30,cue:'30 lb dumbbell in each hand · 11 reps each leg'},
    {n:'Goblet squat',s:5,r:25,w:60,cue:'Holding one 60 lb dumbbell · LOW as possible'},
    {n:'Weighted cable crunch',s:5,r:20,w:null,cue:'Heavy'},
    {n:'Stair stepper',cardio:15}
  ]},
  wed:{title:'Push',sub:'Chest · shoulders · triceps',ex:[
    {n:'Incline bench press',s:5,r:6,w:135,warm:'Bar × 12 · 65 lb × 8',cue:'Touch your chest every rep · superset with light lat pulldowns'},
    {n:'Light lat pulldown',ss:true,s:5,r:10,w:null,cue:'LIGHT — feel a good squeeze in the back each rep'},
    {n:'Flat DB bench press',s:5,r:10,w:60,cue:'60 lb dumbbells · superset with light low cable rows'},
    {n:'Light low cable row',ss:true,s:5,r:10,w:null,cue:'LIGHT — feel a good squeeze in the back each rep'},
    {n:'Cable fly crossover',s:5,r:15,w:null,cue:'Alternate which arm crosses on top each rep'},
    {n:'Tricep cable pressdown',s:4,r:20,w:null,cue:'Hinge at the elbow only'},
    {n:'Dips (assisted or bodyweight)',s:5,amrap:true,w:null,cue:'As many reps as possible · go LOW'},
    {n:'Stair stepper',cardio:10}
  ]},
  thu:{title:'Pull',sub:'Back · biceps',ex:[
    {n:'Pull-ups (assisted or bodyweight)',s:6,r:15,w:null,cue:'STRICT — contract the back only, no momentum, all the way down'},
    {n:'Wide-grip lat pulldown',s:6,r:15,w:null,cue:'2 sec hold at the bottom of each rep'},
    {n:'Low cable row',s:6,r:15,w:null,cue:'Pull the cable directly to your belly button'},
    {n:'Single-arm DB row',s:5,r:8,w:50,cue:'50 lb dumbbell · 8 reps each arm'},
    {n:'EZ-bar bicep curl',s:6,r:15,w:65,cue:'65 lb curl bar'},
    {n:'Barbell row',s:5,r:15,w:115,cue:'35 lb each side of the bar (115 total with a 45 lb bar)'},
    {n:'Stair stepper',cardio:12}
  ]},
  fri:{title:'Cardio',sub:'Conditioning',ex:[{n:'Stair stepper',cardio:25}]},
  sat:{title:'Legs',sub:'Deadlift day',ex:[
    {n:'Deadlift',s:5,r:6,w:190,warm:'135 lb × 8',cue:'Flat back · hinge at the waist'},
    {n:'Squat',s:4,amrap:true,w:135,cue:'Max reps · LOW every rep — sink hips way past parallel'},
    {n:'Leg extension',s:5,r:15,w:null,cue:'3 sec hold at the top every 5th rep'},
    {n:'Hamstring curl',s:5,r:15,w:null,cue:'3 sec hold at the top every 5th rep'},
    {n:'Lunges (DB)',s:4,r:12,w:25,cue:'25 lb in each hand · 12 reps each leg'},
    {n:'Stair stepper',cardio:15}
  ]},
  sun:{title:'Rest',rest:true,sub:'Recovery day',ex:[]}
};
const PLANNED=5;

/* ───────── STORAGE ───────── */
const KEY='ironlog.v1';
const blank=()=>({v:1,sessions:{},weights:[],sleep:[],lastBackup:null});
let S=(()=>{try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.v===1)return Object.assign(blank(),d)}catch(e){}return blank()})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Storage blocked — use Backup')}}

/* ───────── HELPERS ───────── */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const pad=n=>String(n).padStart(2,'0');
const ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>ds(new Date());
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const dayKey=s=>DAYS[(pd(s).getDay()+6)%7];
const weekStart=s=>addDays(s,-((pd(s).getDay()+6)%7));
const fmtD=(s,o={month:'short',day:'numeric'})=>pd(s).toLocaleDateString('en-CA',o);
const avg=a=>a.reduce((s,x)=>s+x,0)/a.length;
const sd=a=>{if(a.length<2)return 0;const m=avg(a);return Math.sqrt(avg(a.map(x=>(x-m)**2)))};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toMin=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const sleepDur=x=>{let d=toMin(x.wake)-toMin(x.bed);if(d<=0)d+=1440;return d/60};
const bedNorm=t=>{let m=toMin(t);if(m<12*60)m+=1440;return m};
const fmtH=h=>{const m=Math.round(h*60);return `${Math.floor(m/60)}h ${pad(m%60)}m`};
const fmtClock=n=>{n=((Math.round(n)%1440)+1440)%1440;return pad(Math.floor(n/60))+':'+pad(n%60)};
const stat=(b,s)=>`<div class="stat"><b>${b}</b><span>${s}</span></div>`;
const CHECK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1800)}
function download(name,text,type){const b=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},600)}

/* ───────── UI STATE ───────── */
const ui={tab:'train',date:today(),day:dayKey(today()),week:weekStart(today()),range:'90',wdate:today(),sdate:today(),crave:null,_draft:null};
function syncCrave(){const e=S.sleep.find(x=>x.date===ui.sdate);ui.crave=e&&e.craving!=null?e.craving:null}

/* ───────── SESSIONS ───────── */
const sesDone=s=>s.ex.some(e=>e.sets.some(x=>x.d));
function lastEx(day,name,before){
  const ks=Object.values(S.sessions).filter(s=>s.day===day&&s.date<before).sort((a,b)=>b.date.localeCompare(a.date));
  for(const s of ks){const e=s.ex.find(e=>e.n===name);if(e&&e.sets.some(x=>x.d))return{date:s.date,e}}
  return null;
}
function buildSession(date,day){
  const t=ROUTINE[day];
  return{date,day,title:t.title,notes:'',ex:t.ex.map(e=>{
    if(e.cardio)return{n:e.n,cardio:true,sets:[{m:e.cardio,d:false}]};
    const last=lastEx(day,e.n,date);
    return{n:e.n,sets:Array.from({length:e.s},(_,i)=>{
      const ls=last&&last.e.sets[i];const lw=ls&&ls.w!==''&&ls.w!=null?ls.w:null;
      return{w:lw??(e.w??''),r:e.amrap?'':e.r,d:false}})};
  })};
}
function curSession(){
  const k=ui.date+'|'+ui.day;
  if(S.sessions[k])return S.sessions[k];
  if(!ui._draft||ui._draft.k!==k)ui._draft={k,s:buildSession(ui.date,ui.day)};
  return ui._draft.s;
}
function commit(){const k=ui.date+'|'+ui.day;if(!S.sessions[k])S.sessions[k]=curSession();S.sessions[k].updated=Date.now();save()}
function hintFor(t){
  if(t.cardio)return'';
  const last=lastEx(ui.day,t.n,ui.date);if(!last)return'';
  const done=last.e.sets.filter(x=>x.d);
  const str=done.map(x=>(x.w!==''&&x.w!=null?x.w+'×':'')+(x.r||'?')).join(' · ');
  let tip='';
  if(!t.amrap&&t.r&&done.length===last.e.sets.length&&done.every(x=>+x.r>=t.r)&&done[0].w!=='')tip=' — every set hit. Add 5 lb today.';
  return `Last (${fmtD(last.date)}): ${str}${tip}`;
}

/* ───────── TRAIN ───────── */
function exCard(t,e,ei){
  if(!e)return'';
  if(t.cardio){const x=e.sets[0];return `<div class="card"><div class="ex-name">${t.n}</div><div class="rx">${t.cardio} min</div>
    <div class="sets"><div class="set ${x.d?'done':''}" data-ei="${ei}" data-si="0"><span class="no">—</span>
    <label class="field" style="grid-column:span 2"><input inputmode="numeric" data-f="m" value="${esc(x.m)}"><small>min</small></label>
    <button class="check" data-act="tick" aria-label="Done">${CHECK}</button></div></div></div>`}
  const rx=`${t.s} sets × ${t.amrap?'max reps':t.r+' reps'}${t.w?' · '+t.w+' lb':''}`;
  const sets=e.sets.map((x,si)=>`<div class="set ${x.d?'done':''}" data-ei="${ei}" data-si="${si}"><span class="no">${si+1}</span>
    <label class="field"><input inputmode="decimal" data-f="w" value="${esc(x.w)}" placeholder="—"><small>lb</small></label>
    <label class="field"><input inputmode="numeric" data-f="r" value="${esc(x.r)}" placeholder="${t.amrap?'max':''}"><small>reps</small></label>
    <button class="check" data-act="tick" aria-label="Set done">${CHECK}</button></div>`).join('');
  const h=hintFor(t);
  return `<div class="card"><div class="ex-name">${t.n}${t.ss?'<span class="tag">SUPERSET</span>':''}</div><div class="rx">${rx}</div>
    ${t.warm?`<div class="hint">Warm-up: ${t.warm}</div>`:''}${t.cue?`<div class="cue">${t.cue}</div>`:''}${h?`<div class="hint">${h}</div>`:''}
    <div class="sets">${sets}</div></div>`;
}
function renderTrain(){
  const t=ROUTINE[ui.day],td=today();
  const chips=DAYS.map((d,i)=>`<button class="chip ${d===ui.day?'on':''} ${d===dayKey(ui.date)?'today':''}" data-day="${d}" aria-label="${DAYNAMES[d]}">${'MTWTFSS'[i]}</button>`).join('');
  let body='';
  if(t.rest){
    body=`<div class="card"><div class="eyebrow">Rest day</div><p style="margin-top:8px">Nothing scheduled. Recovery is where the muscle actually gets built.</p>
    <ul class="list"><li>Walk 8–10k steps</li><li>Hit your protein</li><li>In bed on time — check the Sleep tab</li></ul></div>`;
  }else{
    const s=curSession();
    const total=s.ex.reduce((a,e)=>a+e.sets.length,0),done=s.ex.reduce((a,e)=>a+e.sets.filter(x=>x.d).length,0),pct=total?done/total*100:0;
    body=`<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin:0 0 6px"><span>${done} / ${total} done</span><span>${Math.round(pct)}%</span></div>
      <div class="progress"><i style="width:${pct}%"></i></div>

}

/* ───────── WEEK ───────── */
function sessionsIn(a,b){return Object.values(S.sessions).filter(s=>s.date>=a&&s.date<=b&&sesDone(s)).sort((x,y)=>x.date.localeCompare(y.date))}
function weekStats(ws){
  const we=addDays(ws,6),ss=sessionsIn(ws,we);let sets=0,vol=0,cardio=0;
  ss.forEach(s=>s.ex.forEach(e=>e.sets.forEach(x=>{if(!x.d)return;if(e.cardio)cardio+=+x.m||0;else{sets++;vol+=(+x.w||0)*(+x.r||0)}})));
  const wl=S.weights.filter(w=>w.date>=ws&&w.date<=we),sl=S.sleep.filter(x=>x.date>=ws&&x.date<=we);
  return{ws,we,ss,sets,vol,cardio,aw:wl.length?avg(wl.map(w=>w.value)):null,as:sl.length?avg(sl.map(sleepDur)):null,workouts:new Set(ss.map(s=>s.date)).size};
}
function renderWeek(){

    <div class="grid2" style="margin-top:14px">

      ${stat(w.sets,'Sets completed')}
      ${stat(w.vol?(w.vol/1000).toFixed(1)+'k':'0','Volume (lb lifted)')}
      ${stat(w.cardio,'Stair stepper (min)')}

    <div class="card" style="padding:2px 16px">${rows}</div>
    <div class="grid2"><button class="btn" id="expWeek">Export week</button><button class="btn ghost" id="expAll">Export all</button></div>
    <p class="hint">CSV files — open in Excel, Numbers or Google Sheets. Includes workouts, weigh-ins and sleep.</p>
    <div class="banner"><b>Your logs live in this browser, on this device.</b> GitHub hosts the app — it does not store your data. Clear your browser data or switch phones without a backup and it's gone.<br><br>Last backup: <b>${age==null?'never':age===0?'today':age+' day'+(age>1?'s':'')+' ago'}</b>
      <div class="grid2" style="margin-top:10px"><button class="btn sm" id="backup" style="width:100%">Backup</button><button class="btn ghost sm" id="restore" style="width:100%">Restore</button></div></div>`;
}
function toCSV(rows){return rows.map(r=>r.map(c=>{c=String(c??'');return/[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(',')).join('\n')}
function exportCSV(a,b,name){
  const out=[['WORKOUTS'],['date','day','workout','exercise','set','weight_lb','reps','minutes','done']];

  out.push([],['BODY WEIGHT'],['date','weight_lb']);
  S.weights.filter(w=>w.date>=a&&w.date<=b).sort((x,y)=>x.date.localeCompare(y.date)).forEach(w=>out.push([w.date,w.value]));
  out.push([],['SLEEP'],['wake_date','bedtime','wake_time','hours','cravings_1to5']);
  S.sleep.filter(x=>x.date>=a&&x.date<=b).sort((x,y)=>x.date.localeCompare(y.date)).forEach(x=>out.push([x.date,x.bed,x.wake,sleepDur(x).toFixed(2),x.craving??'']));

/* ───────── WEIGHT ───────── */
function movingAvg(W){return W.map(w=>{const f=addDays(w.date,-6);return{date:w.date,value:avg(W.filter(x=>x.date>=f&&x.date<=w.date).map(x=>x.value))}})}
function weeklyRate(W){
  const p=W.filter(w=>w.date>=addDays(today(),-28));if(p.length<3)return null;
  const xs=p.map(w=>pd(w.date)/864e5),ys=p.map(w=>w.value);if(Math.max(...xs)-Math.min(...xs)<6)return null;
  const mx=avg(xs),my=avg(ys);let n=0,d=0;xs.forEach((x,i)=>{n+=(x-mx)*(ys[i]-my);d+=(x-mx)**2});return d?n/d*7:null;
}
function lineChart(pts,ma){
  if(!pts.length)return '<div class="hint" style="padding:36px 0;text-align:center">Log your first weigh-in to see the graph.</div>';
  const W=340,H=200,L=34,R=10,T=10,B=22;
  const xs=pts.map(p=>+pd(p.date)),ys=pts.concat(ma).map(p=>p.value);
  let x0=Math.min(...xs),x1=Math.max(...xs);if(x1===x0){x0-=3*864e5;x1+=3*864e5}
  let y0=Math.min(...ys),y1=Math.max(...ys);const pY=Math.max(1,(y1-y0)*.15);y0=Math.floor(y0-pY);y1=Math.ceil(y1+pY);
  const X=t=>L+(t-x0)/(x1-x0)*(W-L-R),Y=v=>T+(1-(v-y0)/(y1-y0))*(H-T-B),dec=y1-y0<8?1:0;
  let g='';for(let i=0;i<=4;i++){const v=y0+(y1-y0)*i/4;g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--line)"/><text x="${L-6}" y="${Y(v)+3}" text-anchor="end" font-size="9" style="fill:var(--mute)">${v.toFixed(dec)}</text>`}
  const dots=pts.map(p=>`<circle cx="${X(+pd(p.date))}" cy="${Y(p.value)}" r="2.6" style="fill:var(--mute)"/>`).join('');
  const path=ma.length>1?`<path d="${ma.map((p,i)=>(i?'L':'M')+X(+pd(p.date)).toFixed(1)+' '+Y(p.value).toFixed(1)).join(' ')}" style="fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round"/>`:'';
  const lp=pts.at(-1);
  const end=`<circle cx="${X(+pd(lp.date))}" cy="${Y(lp.value)}" r="4.5" style="fill:var(--ink);stroke:var(--bg);stroke-width:2"/>`;
  const xl=`<text x="${L}" y="${H-5}" font-size="9" style="fill:var(--mute)">${fmtD(pts[0].date)}</text><text x="${W-R}" y="${H-5}" text-anchor="end" font-size="9" style="fill:var(--mute)">${fmtD(lp.date)}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight trend">${g}${dots}${path}${end}${xl}</svg>`;
}
function renderWeight(){
  const W=[...S.weights].sort((a,b)=>a.date.localeCompare(b.date)),cur=W.at(-1),first=W[0],ma=movingAvg(W),rate=weeklyRate(W);

  return `<div class="eyebrow">Body weight</div>
    <div style="display:flex;align-items:baseline;gap:8px;margin-top:8px"><span class="big">${cur?cur.value.toFixed(1):'—'}</span><span class="mute">lb</span></div>
    <p class="rx">${cur?`${fmtD(cur.date)} · 7-day average <b style="color:var(--ink)">${ma.at(-1).value.toFixed(1)}</b>`:'No entries yet'}</p>
    <div class="card"><div class="grid2"><div><label class="label">Date</label><input type="date" class="input" id="wDate" value="${ui.wdate}"></div>
      <div><label class="label">Weight (lb)</label><input class="input" id="wVal" inputmode="decimal" placeholder="0.0" value="${ex?ex.value:''}"></div></div>

    <p class="hint" style="margin:12px 0">Weigh every morning: after the bathroom, before food or water. Single days swing 2–4 lb on water and salt — judge the 7-day average, never one number.</p>
    ${list?`<div class="card" style="padding:2px 16px">${list}</div>`:''}`;
}

/* ───────── SLEEP ───────── */
const TIPS={
  High:['Protein at your first meal (30–40 g). It is your strongest hunger brake.','Decide dinner now, before 3 pm. A tired brain loses every food negotiation at 8 pm.','Lean on the Unlimited list: black coffee (before 2 pm), diet soda, green veggies with hot sauce.','No caffeine after 2 pm — it buys you today and steals tonight, and the loop repeats.','Train anyway, but no punishment cardio to "earn" food.','In bed 30–45 min earlier tonight. That is the actual fix.'],
  Moderate:['Front-load protein at breakfast and lunch.','Keep trigger foods out of sight today — your willpower is discounted.','Caffeine cutoff 2 pm.','Lights out 15–30 min earlier tonight.'],
  Low:['Good night. Same bedtime tonight — consistency is the multiplier.','Prep tomorrow\'s food today while discipline is cheap.']
};
function riskOf(last,wk,debt){
  if(!last)return null;const d=sleepDur(last);let s=0;const why=[];
  if(d<6){s+=2;why.push(`only ${fmtH(d)} of sleep`)}else if(d<7){s+=1;why.push(`${fmtH(d)} — under 7h`)}
  if(wk.length>=3){const v=sd(wk.map(x=>bedNorm(x.bed)));if(v>60){s+=1;why.push(`bedtime swinging ±${Math.round(v)} min`)}}
  if(bedNorm(last.bed)>=1500){s+=1;why.push('in bed after 1 am')}
  if(debt>5){s+=1;why.push(`${fmtH(debt)} sleep debt this week`)}
  return{level:s>=3?'High':s>=1?'Moderate':'Low',why};
}
function sleepPlan(wk,avgD,sdB,avgBed){
  if(wk.length<3)return['Log at least 3 nights and this becomes a plan built on your own numbers.','Meanwhile: same wake-up time every day, caffeine cutoff 8 h before bed, dark and cool room.'];
  const p=[];
  if(sdB>45)p.push(`Your bedtime swings ±${Math.round(sdB)} min. Fix your <b>wake time</b> first — same time 7 days a week, weekends included (±30 min). Bedtime follows.`);
  if(avgD<7)p.push(`You average ${fmtH(avgD)}. Move bedtime 15 min earlier every 3 nights — next target <b>${fmtClock(avgBed-15)}</b> — until you're at 7h+. Jumping an hour at once doesn't stick.`);
  if(avgBed>=1470)p.push(`Average bedtime ${fmtClock(avgBed)} is late. Late nights are when most snacking happens — a hard stop on food and screens 60 min before bed kills both.`);
  p.push('Caffeine cutoff 8 h before bed. Zero-cal energy drinks count — still caffeine.','Last big meal 2–3 h before bed. Late-night hunger is usually a sleep problem dressed up as a food problem.','Dark, cool room (~18 °C), phone charging out of arm\'s reach.','10 min of daylight within an hour of waking — it sets the clock that makes you sleepy on time.');
  return p;
}
function sleepBars(arr){
  if(!arr.length)return'';
  const W=340,H=150,L=24,B=18,T=8,bw=(W-L-6)/14,Y=h=>T+(1-Math.min(h,10)/10)*(H-T-B);let s='';
  arr.forEach((x,i)=>{const h=sleepDur(x),x0=L+i*bw+bw*.18,w=bw*.64,y=Y(h),bh=H-B-y;
    s+=h>=7?`<rect x="${x0}" y="${y}" width="${w}" height="${bh}" rx="3" style="fill:var(--ink)"/>`
      :`<rect x="${x0+.75}" y="${y+.75}" width="${w-1.5}" height="${Math.max(0,bh-1.5)}" rx="3" style="fill:none;stroke:var(--ink);stroke-width:1.5"/>`;
    s+=`<text x="${x0+w/2}" y="${H-4}" text-anchor="middle" font-size="9" style="fill:var(--mute)">${pd(x.date).getDate()}</text>`});
  s+=`<line x1="${L}" x2="${W-4}" y1="${Y(7)}" y2="${Y(7)}" style="stroke:var(--mute);stroke-dasharray:3 3"/><text x="${L-5}" y="${Y(7)+3}" text-anchor="end" font-size="9" style="fill:var(--mute)">7h</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Sleep, last 14 nights">${s}</svg>`;
}
function renderSleep(){
  const L=[...S.sleep].sort((a,b)=>a.date.localeCompare(b.date)),last=L.at(-1),wk=L.slice(-7),ex=L.find(x=>x.date===ui.sdate);
  const avgD=wk.length?avg(wk.map(sleepDur)):null,sdB=wk.length>=3?sd(wk.map(x=>bedNorm(x.bed))):null;
  const debt=wk.reduce((a,x)=>a+Math.max(0,7.5-sleepDur(x)),0),avgBed=wk.length?avg(wk.map(x=>bedNorm(x.bed))):null;
  const risk=riskOf(last,wk,debt),def=ex||last||{bed:'23:00',wake:'07:00'};
  const C=L.filter(x=>x.craving!=null),sh=C.filter(x=>sleepDur(x)<7),ok=C.filter(x=>sleepDur(x)>=7);
  let pattern;
  if(sh.length>=2&&ok.length>=2){const a=avg(sh.map(x=>+x.craving)),b=avg(ok.map(x=>+x.craving)),d=a-b;
    pattern=`After nights under 7h your cravings average <b>${a.toFixed(1)}/5</b>. After 7h+ nights: <b>${b.toFixed(1)}/5</b>. ${d>=.8?'That gap is real — sleep is one of your biggest diet levers.':d>.3?'A modest effect — still worth protecting.':'Little difference so far. Keep logging; patterns take a few weeks.'} <span class="mute">(${C.length} days)</span>`}
  else pattern=`Rate cravings each evening. Once there are 2+ short-sleep days and 2+ full-sleep days (you have ${sh.length} and ${ok.length}), this shows <b>your</b> effect — not a study's.`;
  const hist=L.slice(-10).reverse().map(x=>`<div class="row"><div><b>${fmtH(sleepDur(x))}</b> <span class="mute" style="font-size:13px">${x.bed} → ${x.wake}${x.craving!=null?' · cravings '+x.craving+'/5':''}</span></div><div style="display:flex;align-items:center;gap:6px"><span class="mute" style="font-size:13px">${fmtD(x.date,{weekday:'short',day:'numeric'})}</span><button class="x" data-dels="${x.date}" aria-label="Delete">×</button></div></div>`).join('');
  return `<div class="eyebrow">Sleep → cravings</div><h1 style="margin-top:6px">Sleep</h1>
    <div class="card">
      <label class="label">Morning you woke up</label><input type="date" class="input" id="sDate" value="${ui.sdate}">
      <div class="grid2" style="margin-top:10px"><div><label class="label">Went to bed</label><input type="time" class="input" id="sBed" value="${def.bed}"></div><div><label class="label">Woke up</label><input type="time" class="input" id="sWake" value="${def.wake}"></div></div>
      <label class="label" style="margin-top:12px">Cravings that day (optional — fill in tonight)</label>
      <div class="chips" style="margin:0">${[1,2,3,4,5].map(n=>`<button type="button" class="chip ${ui.crave===n?'on':''}" data-crave="${n}">${n}</button>`).join('')}</div>
      <div class="rx" style="display:flex;justify-content:space-between;margin-top:4px"><span>none</span><span>intense</span></div>
      <button class="btn" id="saveS" style="margin-top:12px">${ex?'Update':'Save'} night</button></div>
    ${risk?`<div class="card inv"><div class="eyebrow">Craving risk ${last.date===today()?'today':'· night ending '+fmtD(last.date)}</div>
      <div class="risk">${risk.level}</div><p style="opacity:.75;font-size:13px;margin-top:4px">${risk.why.length?'Because: '+risk.why.join(' · '):'7h+ and consistent timing. This is the day discipline is cheapest.'}</p>
      <ul class="list" style="margin-top:10px">${TIPS[risk.level].map(t=>`<li>${t}</li>`).join('')}</ul></div>`
      :`<div class="card"><p>Log last night to get today's craving risk.</p></div>`}
    ${wk.length?`<div class="grid2">${stat(fmtH(sleepDur(last)),'Last night')}${stat(fmtH(avgD),'Average · last '+wk.length)}${stat(sdB!=null?'±'+Math.round(sdB)+'m':'—','Bedtime consistency')}${stat(fmtH(debt),'Sleep debt vs 7.5h')}</div>
      <div class="card"><b>Last 14 nights</b><div class="spacer"></div>${sleepBars(L.slice(-14))}<div class="legend"><span><i class="fill"></i>7h or more</span><span><i class="out"></i>Under 7h</span></div></div>`:''}
    <div class="card"><div class="eyebrow">Your pattern</div><p style="margin-top:6px">${pattern}</p></div>
    <div class="card"><div class="eyebrow">Sleep plan</div><ul class="list">${sleepPlan(wk,avgD,sdB,avgBed).map(t=>`<li>${t}</li>`).join('')}</ul></div>
    <div class="card"><div class="eyebrow">Why sleep drives cravings</div><p style="margin-top:6px;font-size:14px">In sleep-restriction studies, short sleep tends to raise ghrelin (the hunger hormone), lower leptin (the fullness signal), and make high-calorie food more rewarding — next-day intake typically rises by a few hundred calories. That can wipe out a daily deficit on its own. How strong this is for <i>you</i> is what your craving ratings measure.</p></div>
    ${hist?`<div class="card" style="padding:2px 16px">${hist}</div>`:''}`;
}

let tInt=null;
function startTimer(sec){
  const el=$('#timer'),end=Date.now()+sec*1000;clearInterval(tInt);el.hidden=false;
  const tick=()=>{const r=Math.max(0,Math.round((end-Date.now())/1000));
    el.textContent=r>0?`Rest ${Math.floor(r/60)}:${pad(r%60)} · tap to skip`:'Go — next set';
    if(r<=0){clearInterval(tInt);try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}setTimeout(()=>{el.hidden=true},2500)}};

/* ───────── RENDER + EVENTS ───────── */
const VIEWS={train:renderTrain,week:renderWeek,weight:renderWeight,sleep:renderSleep,fuel:renderFuel};
function render(){$('#view').innerHTML=`<div class="wrap">${VIEWS[ui.tab]()}</div>`;$$('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===ui.tab))}

document.addEventListener('click',e=>{
  const t=e.target,c=s=>t.closest(s);let el;
  if(el=c('.tabs button')){ui.tab=el.dataset.tab;render();scrollTo(0,0);return}
  if(c('#timer')){clearInterval(tInt);$('#timer').hidden=true;return}
  if(el=c('[data-day]')){ui.day=el.dataset.day;ui._draft=null;render();return}
  if(el=c('[data-act="tick"]')){const row=el.closest('.set'),s=curSession(),ex=s.ex[+row.dataset.ei],x=ex.sets[+row.dataset.si];
    x.d=!x.d;commit();if(x.d&&!ex.cardio)startTimer(90);try{navigator.vibrate&&navigator.vibrate(12)}catch(_){}render();return}
  if(c('#goToday')){ui.date=today();ui.day=dayKey(ui.date);ui._draft=null;render();return}
  if(c('#resetSes')){if(confirm('Clear everything logged in this session?')){delete S.sessions[ui.date+'|'+ui.day];ui._draft=null;save();render()}return}
  if(el=c('[data-open]')){const d=el.dataset.open,s=Object.values(S.sessions).find(s=>s.date===d&&sesDone(s));ui.tab='train';ui.date=d;ui.day=s?s.day:dayKey(d);ui._draft=null;render();scrollTo(0,0);return}
  if(el=c('[data-wk]')){ui.week=addDays(ui.week,+el.dataset.wk*7);render();return}
  if(c('#expWeek')){exportCSV(ui.week,addDays(ui.week,6),`ironlog-week-${ui.week}.csv`);return}
  if(c('#expAll')){exportCSV('0000','9999',`ironlog-all-${today()}.csv`);return}
  if(c('#backup')){S.lastBackup=Date.now();save();download(`ironlog-backup-${today()}.json`,JSON.stringify(S,null,1),'application/json');toast('Backup downloaded');render();return}
  if(c('#restore')){$('#importFile').click();return}
  if(el=c('[data-range]')){ui.range=el.dataset.range;render();return}
  if(c('#saveW')){const d=$('#wDate').value,v=parseFloat(($('#wVal').value||'').replace(',','.'));
    if(!d||!(v>50&&v<1000)){toast('Enter a valid weight');return}
    const i=S.weights.findIndex(w=>w.date===d);if(i>=0)S.weights[i].value=v;else S.weights.push({date:d,value:v});save();toast('Weigh-in saved');render();return}
  if(el=c('[data-delw]')){if(confirm('Delete this weigh-in?')){S.weights=S.weights.filter(w=>w.date!==el.dataset.delw);save();render()}return}
  if(el=c('[data-crave]')){const n=+el.dataset.crave;ui.crave=ui.crave===n?null:n;$$('[data-crave]').forEach(b=>b.classList.toggle('on',+b.dataset.crave===ui.crave));return}
  if(c('#saveS')){const d=$('#sDate').value,b=$('#sBed').value,w=$('#sWake').value;
    if(!d||!b||!w){toast('Fill in date, bedtime and wake time');return}
    const rec={date:d,bed:b,wake:w,craving:ui.crave};if(sleepDur(rec)>16){toast('Check your times');return}
    const i=S.sleep.findIndex(x=>x.date===d);if(i>=0)S.sleep[i]=rec;else S.sleep.push(rec);save();toast('Night saved');render();return}
  if(el=c('[data-dels]')){if(confirm('Delete this night?')){S.sleep=S.sleep.filter(x=>x.date!==el.dataset.dels);save();syncCrave();render()}return}
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.f){const row=t.closest('.set'),s=curSession();s.ex[+row.dataset.ei].sets[+row.dataset.si][t.dataset.f]=t.value;commit();return}
  if(t.id==='notes'){curSession().notes=t.value;commit()}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='dateIn'){ui.date=t.value||today();ui.day=dayKey(ui.date);ui._draft=null;render()}
  else if(t.id==='wDate'){ui.wdate=t.value||today();render()}
  else if(t.id==='sDate'){ui.sdate=t.value||today();syncCrave();render()}
  else if(t.id==='importFile'){const f=t.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||d.v!==1||!d.sessions)throw 0;
      if(confirm('Replace all data on this device with this backup?')){S=Object.assign(blank(),d);ui._draft=null;save();syncCrave();toast('Backup restored');render()}}
      catch(_){toast('Not a valid Iron Log backup')}t.value=''};r.readAsText(f)}
});

$('#topDate').textContent=fmtD(today(),{weekday:'short',month:'short',day:'numeric'});
syncCrave();render();
</script>
</body>
</html>
